services:
  ubuntu-test:
    build: .
    image: dotfiles-ubuntu-test
    tty: true
    stdin_open: true
    working_dir: /home/testuser/dotfiles
    command: /bin/bash

  ubuntu-bootstrap-test:
    build: .
    image: dotfiles-ubuntu-test
    working_dir: /home/testuser/dotfiles
    environment:
      TERM: dumb
      DEBIAN_FRONTEND: noninteractive
    command: ["/bin/bash", "-lc", "./bootstrap.sh && ./scripts/verify-bootstrap.sh && ./scripts/test.sh"]
