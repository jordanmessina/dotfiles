# improve colors
set -g default-terminal 'screen-256color'

# act like vim
setw -g mode-keys vi

# enable mouse support (click and drag to select, pane-specific)
set -g mouse on

# Use the available platform clipboard command. Later matches take priority.
if-shell 'command -v xclip >/dev/null 2>&1' 'set -s copy-command "xclip -selection clipboard -in"'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -s copy-command "wl-copy"'
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command "pbcopy"'

# vim-like visual selection in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# copy to the system clipboard when selecting with the mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
