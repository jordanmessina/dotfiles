name: Test dotfiles

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck stow zsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pi/.pi/agent/extensions/webfetch/package-lock.json

      - name: Run repository checks
        run: ./scripts/test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Ubuntu test image
        run: docker compose build ubuntu-test
